name: Tooling or site bug
description: Something in tools/, the CI workflows or the browsable site does not work. For wrong data, use "Correct a company".
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and its full output, or the page URL and browser.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, macOS 15
